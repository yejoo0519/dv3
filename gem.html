<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보주 - Dragon Village 3</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c18; --bg2: #10132a; --bg3: #161a30; --bg4: #1c2038;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
  --accent: #7c6aff; --accent2: #a693ff; --gold: #f5c542;
  --text: #eae8f5; --text2: #9996b0; --text3: #4e4c66;
  --legendary: #f5c542; --legendary-bg: rgba(245,197,66,0.12); --legendary-border: rgba(245,197,66,0.25);
  --heroic: #b47fff; --heroic-bg: rgba(180,127,255,0.12); --heroic-border: rgba(180,127,255,0.25);
  --rare: #38bdf8; --rare-bg: rgba(56,189,248,0.10); --rare-border: rgba(56,189,248,0.22);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; }

.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,12,24,0.9); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 52px;
}
.logo { font-family: 'Black Han Sans', sans-serif; font-size: 17px; color: var(--accent2); text-decoration: none; }
.header-nav { display: flex; gap: 4px; }
.nav-a { font-size: 12px; color: var(--text3); padding: 5px 12px; border-radius: 7px; text-decoration: none; border: 1px solid transparent; transition: all .15s; }
.nav-a:hover { color: var(--text2); background: var(--bg3); }
.nav-a.active { color: var(--accent2); background: rgba(124,106,255,0.1); border-color: rgba(124,106,255,0.2); }

.main { max-width: 1000px; margin: 0 auto; padding: 28px 20px 80px; }

/* 툴바 */
.toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.search-input {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 14px; font-size: 13px;
  color: var(--text); font-family: 'Noto Sans KR', sans-serif;
  outline: none; transition: border-color .15s; width: 200px;
}
.search-input::placeholder { color: var(--text3); }
.search-input:focus { border-color: var(--accent); }

/* 필터 */
.filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.filter-group { display: flex; gap: 4px; flex-wrap: wrap; }
.filter-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; align-self: center; }
.fbtn {
  font-size: 11px; padding: 5px 12px; border-radius: 99px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text3); cursor: pointer; font-family: 'Noto Sans KR', sans-serif; transition: all .12s;
}
.fbtn:hover { border-color: var(--border2); color: var(--text2); }
.fbtn.on { border-color: var(--accent); color: var(--accent2); background: rgba(124,106,255,.1); }
.fbtn.grade-legendary.on { border-color: var(--legendary-border); color: var(--legendary); background: var(--legendary-bg); }
.fbtn.grade-heroic.on { border-color: var(--heroic-border); color: var(--heroic); background: var(--heroic-bg); }
.fbtn.grade-rare.on { border-color: var(--rare-border); color: var(--rare); background: var(--rare-bg); }
.result-count { font-size: 12px; color: var(--text3); margin-left: auto; }

/* 보주 그리드 */
.orb-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
}

.orb-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 14px; padding: 0;
  cursor: pointer; overflow: hidden;
  transition: border-color .15s, transform .15s;
  position: relative;
}
.orb-card:hover { border-color: var(--border2); transform: translateY(-2px); }
.orb-card.legendary { border-top: 2px solid var(--legendary); }
.orb-card.heroic    { border-top: 2px solid var(--heroic); }
.orb-card.rare      { border-top: 2px solid var(--rare); }

.orb-img-wrap {
  width: 100%; padding: 16px 0 8px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg3);
}
.orb-img-wrap img { width: 64px; height: 64px; object-fit: contain; image-rendering: pixelated; }
.orb-img-wrap .no-img {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--bg4); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px;
}

.orb-info { padding: 10px 12px 12px; }
.orb-name { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; line-height: 1.3; }
.orb-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
.badge {
  font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; letter-spacing: .03em;
}
.badge-legendary { background: var(--legendary-bg); color: var(--legendary); border: 1px solid var(--legendary-border); }
.badge-heroic    { background: var(--heroic-bg); color: var(--heroic); border: 1px solid var(--heroic-border); }
.badge-rare      { background: var(--rare-bg); color: var(--rare); border: 1px solid var(--rare-border); }
.badge-attr      { background: rgba(255,255,255,.06); color: var(--text2); border: 1px solid var(--border); }
.badge-physical  { background: rgba(255,107,107,.1); color: #ff6b6b; }
.badge-magic     { background: rgba(124,106,255,.1); color: var(--accent2); }
.badge-change    { background: rgba(52,211,153,.1); color: #6ee7b7; }

.orb-skill-name { font-size: 11px; color: var(--text2); }
.orb-obtain { font-size: 10px; color: var(--text3); margin-top: 3px; }

.no-result { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 14px; }

/* 상세 모달 */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 300; align-items: center; justify-content: center; padding: 16px; }
.overlay.open { display: flex; }
.modal {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 20px; width: 100%; max-width: 480px;
  max-height: 88vh; overflow-y: auto;
}
.modal::-webkit-scrollbar { width: 3px; }
.modal::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

.modal-head {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: var(--bg2); z-index: 1; border-radius: 20px 20px 0 0;
}
.modal-title { font-family: 'Black Han Sans', sans-serif; font-size: 18px; color: var(--text); letter-spacing: -.5px; }
.modal-x { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: all .12s; }
.modal-x:hover { border-color: var(--border2); color: var(--text); }

.modal-img-wrap {
  width: 100%; padding: 24px 0 16px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg3);
}
.modal-img-wrap img { width: 96px; height: 96px; object-fit: contain; image-rendering: pixelated; }
.modal-img-wrap .no-img-lg { width: 96px; height: 96px; border-radius: 50%; background: var(--bg4); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 40px; }

.modal-body { padding: 20px; }
.modal-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.modal-badge { font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 99px; }
.mb-legendary { background: var(--legendary-bg); color: var(--legendary); border: 1px solid var(--legendary-border); }
.mb-heroic    { background: var(--heroic-bg); color: var(--heroic); border: 1px solid var(--heroic-border); }
.mb-rare      { background: var(--rare-bg); color: var(--rare); border: 1px solid var(--rare-border); }

.section-label {
  font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--text3); margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
}

.stat-box {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 16px;
}
.stat-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
.stat-label { font-size: 12px; color: var(--text2); }
.stat-val { font-size: 13px; font-weight: 700; color: var(--text); }

.skill-box {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px; margin-bottom: 16px;
}
.skill-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.skill-name-big { font-size: 15px; font-weight: 700; color: var(--text); }
.skill-kind { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 4px; }
.kind-물리 { background: rgba(255,107,107,.12); color: #ff6b6b; }
.kind-마법 { background: rgba(124,106,255,.12); color: var(--accent2); }
.kind-변화 { background: rgba(52,211,153,.12); color: #6ee7b7; }
.skill-stats { display: flex; gap: 10px; margin-bottom: 8px; }
.skill-stat { font-size: 11px; color: var(--text3); }
.skill-stat span { color: var(--text2); font-weight: 500; margin-left: 3px; }
.skill-cost { font-size: 11px; color: var(--text3); margin-bottom: 6px; }
.skill-cost span { color: var(--text2); font-weight: 500; }
.skill-desc-text { font-size: 13px; color: var(--text2); line-height: 1.6; }

.desc-box {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 16px;
  font-size: 13px; color: var(--text2); line-height: 1.6;
}

.obtain-box {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px;
  font-size: 13px; color: var(--text2);
}
.obtain-icon { font-size: 16px; }

@media (max-width: 560px) {
  .header-nav { display: none; }
  .orb-grid { grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); }
  .search-input { width: 100%; }
}
</style>
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">DV3</a>
  <nav class="header-nav">
    <a href="index.html" class="nav-a">홈</a>
    <a href="breeding.html" class="nav-a">교배</a>
    <a href="gem.html" class="nav-a active">보주</a>
    <a href="ability.html" class="nav-a">어빌리티</a>
    <a href="dragon.html" class="nav-a">드래곤</a>
    <a href="obtain.html" class="nav-a">획득처</a>
  </nav>
</header>

<div class="main">
  <div class="toolbar">
    <input class="search-input" type="text" id="search" placeholder="보주 이름 / 스킬 검색..." oninput="render()">
    <span class="result-count" id="result-count"></span>
  </div>

  <div class="filter-row">
    <div class="filter-group">
      <button class="fbtn on" id="f-all" onclick="setFilter('grade','all')">전체</button>
      <button class="fbtn grade-legendary" onclick="setFilter('grade','legendary')">⭐ 전설</button>
      <button class="fbtn grade-heroic"    onclick="setFilter('grade','heroic')">💜 영웅</button>
      <button class="fbtn grade-rare"      onclick="setFilter('grade','rare')">💙 희귀</button>
    </div>
    <div class="filter-sep"></div>
    <div class="filter-group">
      <button class="fbtn on" id="f-attr-all" onclick="setFilter('attr','all')">전체 속성</button>
      <button class="fbtn" onclick="setFilter('attr','신성')">신성</button>
      <button class="fbtn" onclick="setFilter('attr','빛')">빛</button>
      <button class="fbtn" onclick="setFilter('attr','땅')">땅</button>
      <button class="fbtn" onclick="setFilter('attr','물')">물</button>
      <button class="fbtn" onclick="setFilter('attr','영혼')">영혼</button>
      <button class="fbtn" onclick="setFilter('attr','혼돈')">혼돈</button>
      <button class="fbtn" onclick="setFilter('attr','여명')">여명</button>
      <button class="fbtn" onclick="setFilter('attr','어둠')">어둠</button>
      <button class="fbtn" onclick="setFilter('attr','불')">불</button>
      <button class="fbtn" onclick="setFilter('attr','번개')">번개</button>
      <button class="fbtn" onclick="setFilter('attr','강철')">강철</button>
      <button class="fbtn" onclick="setFilter('attr','꿈')">꿈</button>
      <button class="fbtn" onclick="setFilter('attr','바람')">바람</button>
      <button class="fbtn" onclick="setFilter('attr','황혼')">황혼</button>
    </div>
    <div class="filter-sep"></div>
    <div class="filter-group">
      <button class="fbtn on" id="f-kind-all" onclick="setFilter('kind','all')">전체 타입</button>
      <button class="fbtn" onclick="setFilter('kind','물리')">⚔️ 물리</button>
      <button class="fbtn" onclick="setFilter('kind','마법')">✨ 마법</button>
      <button class="fbtn" onclick="setFilter('kind','변화')">🔄 변화</button>
    </div>
  </div>

  <div class="orb-grid" id="orb-grid"></div>
</div>

<!-- 상세 모달 -->
<div class="overlay" id="overlay" onclick="closeOverlay(event)">
  <div class="modal" id="modal">
    <div class="modal-head">
      <span class="modal-title" id="m-title"></span>
      <button class="modal-x" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-img-wrap" id="m-img-wrap"></div>
    <div class="modal-body">
      <div class="modal-badges" id="m-badges"></div>
      <div class="section-label">핵심 능력치</div>
      <div class="stat-box" id="m-stat"></div>
      <div class="section-label">보주 스킬</div>
      <div class="skill-box" id="m-skill"></div>
      <div class="section-label">보주 설명</div>
      <div class="desc-box" id="m-desc"></div>
      <div class="section-label">주요 획득처</div>
      <div class="obtain-box" id="m-obtain"></div>
    </div>
  </div>
</div>

<script>
const ORB_BASE = 'https://raw.githubusercontent.com/yejoo0519/dv3/main/images/orb/';

const OBTAIN_ICON = {
  '뽑기': '🎰', '레이드': '⚔️', '길드 상점': '🏪', '명예 상점': '🏆',
  '제작소': '🔨', '월간 패스': '📅', '레이드 패스': '🎯', '뽑기 - 직업': '🎰',
};

// ── 보주 데이터 ─────────────────────────────────────────────
// grade: legendary | heroic | rare
// attr: 속성
// kind: 물리 | 마법 | 변화
// power: X = null
// img: orb_{attr_en}_{grade_num}_{num}.png 형식
const ATTR_EN = {
  '신성':'divine','빛':'light','땅':'earth','물':'water','영혼':'soul',
  '혼돈':'chaos','여명':'dawn','어둠':'dark','불':'fire','번개':'lightning',
  '강철':'steel','꿈':'dream','바람':'wind','황혼':'dusk'
};
const GRADE_NUM = { legendary:'03', heroic:'02', rare:'01' };

function orbImg(attr, grade, num) {
  const en = ATTR_EN[attr];
  const gn = GRADE_NUM[grade];
  if (!en || !gn) return null;
  return `${ORB_BASE}orb_${en}_${gn}_0${num}.png`;
}

const ORBS = [
  // ── 전설 ──
  { name:'천상강림 보주', grade:'legendary', attr:'신성', img:orbImg('신성','legendary',1),
    stat:'모든 핵심 능력치 +22', skill:'천상강림', kind:'물리', acc:100, power:60, cost:2,
    skillDesc:'강림하여 천사의 날개가 나타나 혼돈을 잠재운다.',
    desc:'천상강림 스킬이 발현된 신성속성 보주다. 신성속성을 지니고 있는 드래곤만 장착할 수 있다.',
    obtain:'길드 상점' },

  { name:'찬란한 빛 보주', grade:'legendary', attr:'빛', img:orbImg('빛','legendary',1),
    stat:'모든 핵심 능력치 +22', skill:'찬란한 빛', kind:'물리', acc:100, power:60, cost:2,
    skillDesc:'눈이 멀 정도의 빛으로 가로막는 모든 것을 녹이며 공격한다. 몽환의 꽃잎 상태를 제거하고 공격할 수 있다.',
    desc:'찬란한 빛 스킬이 발현된 빛속성 보주다. 빛속성을 지니고 있는 드래곤만 장착할 수 있다.',
    obtain:'뽑기' },

  { name:'지하습격 보주', grade:'legendary', attr:'땅', img:orbImg('땅','legendary',1),
    stat:'모든 핵심 능력치 +22', skill:'지하습격', kind:'물리', acc:100, power:60, cost:2,
    skillDesc:'지하로 땅굴을 파고 들어가 숨은 다음, 2턴째에 튀어나오면서 공격한다. 숨었을 때는 공격을 맞지 않는다.',
    desc:'지하습격 스킬이 발현된 땅속성 보주다. 땅속성을 지니고 있는 드래곤만 장착할 수 있다.',
    obtain:'뽑기' },

  { name:'제네시스다이브 보주', grade:'legendary', attr:'빛', img:orbImg('빛','legendary',2),
    stat:'모든 핵심 능력치 +22', skill:'제네시스다이브', kind:'물리', acc:100, power:90, cost:2,
    skillDesc:'강력한 빛으로 변해 적을 강타한다. 충격으로 인해 자신의 방어와 저항 능력치가 1단계씩 떨어진다.',
    desc:'제네시스다이브 스킬이 발현된 빛속성 보주다. 빛속성을 지니고 있는 드래곤만 장착할 수 있다.',
    obtain:'뽑기 - 직업' },

  { name:'얼음 장벽 보주', grade:'legendary', attr:'물', img:orbImg('물','legendary',1),
    stat:'모든 핵심 능력치 +22', skill:'얼음 장벽', kind:'마법', acc:100, power:65, cost:2,
    skillDesc:'발밑의 모든 것을 얼어붙게 하여 큰 피해를 준다.',
    desc:'얼음 장벽 스킬이 발현된 물속성 보주다. 물속성을 지니고 있는 드래곤만 장착할 수 있다.',
    obtain:'뽑기' },

  { name:'악의 가르기 보주', grade:'legendary', attr:'영혼', img:orbImg('영혼','legendary',1),
    stat:'모든 핵심 능력치 +22', skill:'악의 가르기', kind:'물리', acc:100, power:60, cost:2,
    skillDesc:'살기를 담은 발톱으로 공격한다. 15% 확률로 적을 침식 상태로 만든다.',
    desc:'악의 가르기 스킬이 발현된 영혼속성 보주다. 영혼속성을 지니고 있는 드래곤만 장착할 수 있다.',
    obtain:'뽑기' },

  { name:'새도우 스피어 보주', grade:'legendary', attr:'혼돈', img:orbImg('혼돈','legendary',1),
    stat:'모든 핵심 능력치 +22', skill:'새도우 스피어', kind:'마법', acc:100, power:65, cost:2,
    skillDesc:'그림자의 공을 만들어 빛과 어둠의 경계를 허문다. 5% 확률로 적을 결정 상태로 만든다.',
    desc:'새도우 스피어 스킬이 발현된 혼돈속성 보주다. 혼돈속성을 지니고 있는 드래곤만 장착할 수 있다.',
    obtain:'길드 상점' },

const GRADE_LABEL = { legendary:'전설', heroic:'영웅', rare:'희귀' };
const KIND_LABEL = { '물리':'⚔️ 물리', '마법':'✨ 마법', '변화':'🔄 변화' };

let gradeF = 'all', attrF = 'all', kindF = 'all';
let currentOrb = null;

function setFilter(type, val) {
  if (type === 'grade') {
    gradeF = val;
    document.querySelectorAll('.fbtn.grade-legendary,.fbtn.grade-heroic,.fbtn.grade-rare,#f-all').forEach(b => b.classList.remove('on'));
    if (val === 'all') document.getElementById('f-all').classList.add('on');
    else document.querySelector(`.fbtn.grade-${val}`)?.classList.add('on');
  } else if (type === 'attr') {
    attrF = val;
    document.querySelectorAll('.filter-group:nth-child(3) .fbtn').forEach(b => b.classList.remove('on'));
    if (val === 'all') document.getElementById('f-attr-all').classList.add('on');
    else event.target.classList.add('on');
  } else if (type === 'kind') {
    kindF = val;
    document.querySelectorAll('.filter-group:nth-child(5) .fbtn').forEach(b => b.classList.remove('on'));
    if (val === 'all') document.getElementById('f-kind-all').classList.add('on');
    else event.target.classList.add('on');
  }
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase().replace(/ /g,'');
  const grid = document.getElementById('orb-grid');
  const countEl = document.getElementById('result-count');

  const filtered = ORBS.filter(o => {
    const gOk = gradeF === 'all' || o.grade === gradeF;
    const aOk = attrF === 'all' || o.attr === attrF;
    const kOk = kindF === 'all' || o.kind === kindF;
    const sOk = !q || o.name.replace(/ /g,'').toLowerCase().includes(q) || o.skill.replace(/ /g,'').toLowerCase().includes(q);
    return gOk && aOk && kOk && sOk;
  });

  countEl.textContent = filtered.length + '개';

  if (!filtered.length) {
    grid.innerHTML = '<div class="no-result">해당하는 보주가 없습니다</div>';
    return;
  }

  grid.innerHTML = filtered.map((o, i) => `
    <div class="orb-card ${o.grade}" onclick="openDetail(${ORBS.indexOf(o)})">
      <div class="orb-img-wrap">
        ${o.img
          ? `<img src="${o.img}" alt="${o.name}" onerror="this.parentNode.innerHTML='<div class=\\'no-img\\'>💎</div>'">`
          : '<div class="no-img">💎</div>'}
      </div>
      <div class="orb-info">
        <div class="orb-name">${o.name}</div>
        <div class="orb-badges">
          <span class="badge badge-${o.grade}">${GRADE_LABEL[o.grade]}</span>
          <span class="badge badge-attr">${o.attr}</span>
          <span class="badge badge-${o.kind === '물리' ? 'physical' : o.kind === '마법' ? 'magic' : 'change'}">${o.kind}</span>
        </div>
        <div class="orb-skill-name">${o.skill}</div>
        <div class="orb-obtain">${OBTAIN_ICON[o.obtain] || ''} ${o.obtain}</div>
      </div>
    </div>`).join('');
}

function openDetail(idx) {
  const o = ORBS[idx];
  currentOrb = o;
  document.getElementById('m-title').textContent = o.name;

  const imgWrap = document.getElementById('m-img-wrap');
  if (o.img) {
    imgWrap.innerHTML = `<img src="${o.img}" alt="${o.name}" onerror="this.parentNode.innerHTML='<div class=\\'no-img-lg\\'>💎</div>'">`;
  } else {
    imgWrap.innerHTML = '<div class="no-img-lg">💎</div>';
  }

  const gradeClass = { legendary:'mb-legendary', heroic:'mb-heroic', rare:'mb-rare' };
  document.getElementById('m-badges').innerHTML = `
    <span class="modal-badge ${gradeClass[o.grade]}">${GRADE_LABEL[o.grade]}</span>
    <span class="modal-badge" style="background:rgba(255,255,255,.06);color:var(--text2);border:1px solid var(--border)">${o.attr}속성</span>`;

  document.getElementById('m-stat').innerHTML = `
    <div class="stat-row"><span class="stat-label">핵심 능력치</span><span class="stat-val">${o.stat}</span></div>`;

  document.getElementById('m-skill').innerHTML = `
    <div class="skill-head">
      <span class="skill-name-big">${o.skill}</span>
      <span class="skill-kind kind-${o.kind}">${o.kind}</span>
    </div>
    <div class="skill-stats">
      <span class="skill-stat">명중<span>${o.acc}</span></span>
      <span class="skill-stat">위력<span>${o.power ?? 'X'}</span></span>
    </div>
    <div class="skill-cost">에너지(코스트) <span>${o.cost}</span></div>
    <div class="skill-desc-text">${o.skillDesc}</div>`;

  document.getElementById('m-desc').textContent = o.desc;
  document.getElementById('m-obtain').innerHTML = `<span class="obtain-icon">${OBTAIN_ICON[o.obtain] || '📍'}</span>${o.obtain}`;

  document.getElementById('overlay').classList.add('open');
  document.getElementById('modal').scrollTop = 0;
}

function closeModal() { document.getElementById('overlay').classList.remove('open'); }
function closeOverlay(e) { if (e.target === document.getElementById('overlay')) closeModal(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

render();
</script>
</body>
</html>

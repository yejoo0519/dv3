<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>획득처 - Dragon Village 3</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c18; --bg2: #10132a; --bg3: #161a30;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
  --accent: #7c6aff; --accent2: #a693ff; --gold: #f5c542;
  --text: #eae8f5; --text2: #9996b0; --text3: #4e4c66;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; }

.header {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 52px;
}
.logo { font-family: 'Black Han Sans', sans-serif; font-size: 17px; color: var(--accent2); text-decoration: none; }
.sep { color: var(--text3); font-size: 13px; }
.page-name { font-size: 13px; color: var(--text2); }
.header-nav { display: flex; gap: 4px; }
.nav-a { font-size: 12px; color: var(--text3); padding: 5px 12px; border-radius: 7px; text-decoration: none; border: 1px solid transparent; transition: all .15s; }
.nav-a:hover { color: var(--text2); background: var(--bg3); }
.nav-a.active { color: var(--accent2); background: rgba(124,106,255,0.1); border-color: rgba(124,106,255,0.2); }

.main { max-width: 1000px; margin: 0 auto; padding: 28px 20px 80px; }

.tabs {
  display: flex; gap: 4px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 4px; margin-bottom: 24px;
  width: fit-content; flex-wrap: wrap;
}
.tab {
  padding: 8px 18px; border-radius: 9px; border: none;
  font-size: 13px; font-weight: 500; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.15s; color: var(--text3); background: transparent;
  display: flex; align-items: center; gap: 6px;
}
.tab.active { color: #fff; }
.tab:not(.active):hover { color: var(--text2); background: var(--bg3); }
.tab-gacha.active  { background: #b45309; }
.tab-raid.active   { background: #b91c1c; }
.tab-latea.active  { background: var(--accent); }
.tab-shop.active   { background: #065f46; }
.tab-breed.active  { background: #374151; }

.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.search-input {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 14px; font-size: 13px;
  color: var(--text); font-family: 'Noto Sans KR', sans-serif;
  outline: none; transition: border-color .15s; width: 200px;
}
.search-input::placeholder { color: var(--text3); }
.search-input:focus { border-color: var(--accent); }
.sort-grp { display: flex; gap: 4px; margin-left: auto; }
.sort-btn {
  font-size: 11px; padding: 5px 12px; border-radius: 99px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text3); cursor: pointer; font-family: 'Noto Sans KR', sans-serif; transition: all .12s;
}
.sort-btn:hover { border-color: var(--border2); color: var(--text2); }
.sort-btn.on { border-color: var(--accent); color: var(--accent2); background: rgba(124,106,255,.1); }
.result-count { font-size: 12px; color: var(--text3); }

.section-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px; padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.section-title { font-family: 'Black Han Sans', sans-serif; font-size: 18px; color: var(--text); letter-spacing: -.5px; }
.section-count { font-size: 12px; color: var(--text3); margin-left: auto; }

.dragon-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 8px; margin-bottom: 40px;
}
.dragon-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 8px 10px;
  display: flex; flex-direction: column; align-items: center;
  gap: 5px; text-align: center;
  transition: border-color .15s, transform .15s, box-shadow .15s;
  cursor: pointer;
}
.dragon-card:hover { border-color: var(--border2); transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
.dc-img {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--bg3); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.dc-img img { width: 46px; height: 46px; object-fit: contain; image-rendering: pixelated; }
.dc-kor { font-size: 11px; font-weight: 700; color: var(--text); line-height: 1.3; }
.dc-eng { font-size: 9px; color: var(--text3); }

.no-result { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 14px; }

/* ── 상세 모달 ── */
.detail-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.detail-overlay.open { opacity: 1; pointer-events: all; }

.detail-sheet {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 24px 24px 0 0;
  width: 100%; max-width: 520px;
  padding: 28px 24px 36px;
  transform: translateY(40px); transition: transform .25s cubic-bezier(.4,0,.2,1);
  position: relative; max-height: 90vh; overflow-y: auto;
}
.detail-overlay.open .detail-sheet { transform: translateY(0); }

.sheet-handle {
  width: 40px; height: 4px; background: var(--border2);
  border-radius: 99px; margin: 0 auto 24px;
}

.detail-close {
  position: absolute; top: 20px; right: 20px;
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--text3); font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.detail-close:hover { color: var(--text); border-color: var(--border2); }

/* 모달 상단: 이미지 + 이름 */
.detail-top {
  display: flex; align-items: center; gap: 18px; margin-bottom: 22px;
}
.detail-img-wrap {
  width: 80px; height: 80px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; border: 2px solid var(--border2);
  background: var(--bg3);
}
.detail-img-wrap img { width: 66px; height: 66px; object-fit: contain; image-rendering: pixelated; }
.detail-info { flex: 1; }
.detail-grade-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10px; font-weight: 700; letter-spacing: .06em;
  padding: 3px 10px; border-radius: 99px; margin-bottom: 6px;
}
.badge-legendary { background: rgba(245,197,66,.15); color: var(--gold); border: 1px solid rgba(245,197,66,.3); }
.badge-heroic    { background: rgba(124,106,255,.15); color: var(--accent2); border: 1px solid rgba(124,106,255,.3); }
.badge-rare      { background: rgba(56,189,248,.12); color: #7dd3fc; border: 1px solid rgba(56,189,248,.25); }
.badge-common    { background: rgba(255,255,255,.06); color: var(--text3); border: 1px solid var(--border); }
.detail-kor { font-family: 'Black Han Sans', sans-serif; font-size: 22px; letter-spacing: -.5px; color: var(--text); }
.detail-eng { font-size: 12px; color: var(--text3); margin-top: 2px; }

/* 구분선 */
.detail-divider { height: 1px; background: var(--border); margin: 16px 0; }

/* 속성 섹션 */
.detail-section-label {
  font-size: 10px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--text3); margin-bottom: 10px;
}
.attr-list { display: flex; flex-wrap: wrap; gap: 6px; }
.attr-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 600;
  padding: 5px 12px; border-radius: 99px;
}
.attr-thunder  { background: rgba(245,197,66,.15);  color: #f5d060; border: 1px solid rgba(245,197,66,.3); }
.attr-fire     { background: rgba(249,115,22,.15);  color: #fb923c; border: 1px solid rgba(249,115,22,.3); }
.attr-water    { background: rgba(56,189,248,.15);  color: #7dd3fc; border: 1px solid rgba(56,189,248,.3); }
.attr-wind     { background: rgba(52,211,153,.15);  color: #6ee7b7; border: 1px solid rgba(52,211,153,.3); }
.attr-poison   { background: rgba(163,230,53,.15);  color: #a3e635; border: 1px solid rgba(163,230,53,.3); }
.attr-earth    { background: rgba(180,135,70,.15);  color: #c4985a; border: 1px solid rgba(180,135,70,.3); }
.attr-dark     { background: rgba(124,106,255,.15); color: var(--accent2); border: 1px solid rgba(124,106,255,.3); }
.attr-light    { background: rgba(255,255,255,.1);  color: #f0ecff; border: 1px solid rgba(255,255,255,.2); }
.attr-none     { background: var(--bg3); color: var(--text3); border: 1px solid var(--border); font-size: 11px; }

/* 획득처 섹션 */
.obtain-row {
  display: flex; align-items: flex-start; gap: 12px;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 16px;
}
.obtain-icon { font-size: 20px; line-height: 1; margin-top: 1px; }
.obtain-label { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
.obtain-detail { font-size: 12px; color: var(--text2); line-height: 1.5; }
.obtain-note { font-size: 11px; color: #ef4444; margin-top: 4px; font-weight: 600; }

@media (max-width: 560px) {
  .header-nav { display: flex; gap: 4px; }
  .dragon-grid { grid-template-columns: repeat(auto-fill, minmax(85px,1fr)); }
  .search-input { width: 100%; }
  .detail-sheet { border-radius: 20px 20px 0 0; padding: 20px 18px 32px; }
}
</style>
</head>

      </div>

    <div class="detail-divider"></div>

    <div class="attr-list" id="d-attrs"></div>
    <div class="detail-divider"></div>
    <div class="detail-section-label">획득처</div>
    <div class="obtain-row">
      <div class="obtain-icon" id="d-obtain-icon"></div>
      <div>

        <div class="obtain-detail" id="d-obtain-detail"></div>
        <div class="obtain-note" id="d-obtain-note"></div>
      </div>
    </div>
  </div>

const TAB_INFO = {
  gacha:  { key:'뽑기',        icon:'🎰', label:'뽑기',        desc:'가챠를 통해 획득' },
  raid:   { key:'레이드',      icon:'⚔️', label:'레이드',      desc:'레이드 보상으로 획득' },
  latea:  { key:'라테아의 문', icon:'🚪', label:'라테아의 문', desc:'라테아의 문을 통해 획득' },
  shop:   { key:'빌리지 상점', icon:'🏪', label:'빌리지 상점', desc:'빌리지 상점에서 구매' },
  breed:  { key:'교배',        icon:'🧬', label:'교배',        desc:'교배를 통해 획득' },
};

const GRADE_LABEL = { legendary:'전설', heroic:'영웅', rare:'희귀', common:'일반' };
const GRADE_ORDER = { legendary:4, heroic:3, rare:2, common:1 };



let currentTab = 'gacha';
let sortMode = 'grade';

function switchTab(tab) {
  currentTab = tab;
  Object.keys(TAB_INFO).forEach(t =>
    document.getElementById('tab-'+t).classList.toggle('active', t===tab)
  );
  render();
}

function setSort(s) {
  sortMode = s;
  document.getElementById('sort-grade').classList.toggle('on', s==='grade');
  document.getElementById('sort-name').classList.toggle('on', s==='name');
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase().replace(/ /g,'');
  const info = TAB_INFO[currentTab];
  let list = DRAGONS.filter(d => {
    const tabMatch = d.obtain === info.key;
    const searchMatch = !q || d.kor.replace(/ /g,'').toLowerCase().includes(q) || d.eng.toLowerCase().includes(q);
    return tabMatch && searchMatch;
  });

  if (sortMode === 'grade') {
    list.sort((a,b) => (GRADE_ORDER[b.grade]||0) - (GRADE_ORDER[a.grade]||0) || a.kor.localeCompare(b.kor));
  } else {
    list.sort((a,b) => a.kor.localeCompare(b.kor));
  }

  document.getElementById('result-count').textContent = list.length + '마리';

  if (!list.length) {
    document.getElementById('content').innerHTML = '<div class="no-result">해당하는 드래곤이 없습니다</div>';
    return;
  }

  if (sortMode === 'grade') {
    const groups = {};
    list.forEach(d => { if (!groups[d.grade]) groups[d.grade] = []; groups[d.grade].push(d); });
    const order = ['legendary','heroic','rare','common'];
    document.getElementById('content').innerHTML = order.filter(g => groups[g]).map(g => `
      <div>
        <div class="section-head">
          <span class="section-title">${GRADE_LABEL[g]}</span>
          <span class="section-count">${groups[g].length}마리</span>
        </div>
        <div class="dragon-grid">${groups[g].map(d => dragonCard(d)).join('')}</div>
      </div>
    `).join('');
  } else {
    document.getElementById('content').innerHTML =
      `<div class="dragon-grid">${list.map(d => dragonCard(d)).join('')}</div>`;
  }
}

function dragonCard(d) {
  return `<div class="dragon-card" onclick="openDetail('${d.id}')">
    <div class="dc-img"><img src="${BASE}${d.id}.png" alt="${d.kor}" onerror="this.style.opacity=.2"></div>
    <div class="dc-kor">${d.kor}</div>
    <div class="dc-eng">${d.eng}</div>
  </div>`;
}

// ── 상세 모달 ─────────────────────────────────────────────────
function openDetail(id) {
  const d = DRAGONS.find(x => x.id === id);
  if (!d) return;

  // 이미지
  document.getElementById('d-img').innerHTML =
    `<img src="${BASE}${d.id}.png" alt="${d.kor}" onerror="this.style.opacity=.2">`;

  // 등급 배지
  const badgeClass = { legendary:'badge-legendary', heroic:'badge-legendary badge-heroic', rare:'badge-rare', common:'badge-common' };
  const gradeEl = document.getElementById('d-grade');
  gradeEl.className = 'detail-grade-badge badge-' + d.grade;
  gradeEl.textContent = GRADE_LABEL[d.grade] || d.grade;

  // 이름
  document.getElementById('d-kor').textContent = d.kor;
  document.getElementById('d-eng').textContent = d.eng;

  // 속성
  const attrs = ATTRS[id] || [];
  const attrEl = document.getElementById('d-attrs');
  if (attrs.length) {
    attrEl.innerHTML = attrs.map(a => {
      const icon = ATTR_ICON[a] ? `<img src="${ATTR_ICON_BASE}${ATTR_ICON[a]}" style="width:32px;height:32px;object-fit:contain">` : '';
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:5px">
        ${icon}
        <span style="font-size:11px;font-weight:700;color:var(--text2)">${a}</span>
      </div>`;
    }).join('');
  } else {
    attrEl.innerHTML = '<span class="attr-badge attr-none">속성 정보 없음</span>';
  }

  // 획득처
  const info = Object.values(TAB_INFO).find(t => t.key === d.obtain) || {};
  document.getElementById('d-obtain-icon').textContent = info.icon || '📍';
  document.getElementById('d-obtain-label').textContent = d.obtain;
  document.getElementById('d-obtain-detail').textContent = DETAIL[id] || info.desc || '';
  const noteEl = document.getElementById('d-obtain-note');
  noteEl.textContent = d.note ? '⚠ ' + d.note : '';

  document.getElementById('detail-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('detail-overlay')) closeDetail();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

render();
</script>
</body>
</html>

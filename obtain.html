<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>획득처 - Dragon Village 3</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c18; --bg2: #10132a; --bg3: #161a30;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
  --accent: #7c6aff; --accent2: #a693ff; --gold: #f5c542;
  --text: #eae8f5; --text2: #9996b0; --text3: #4e4c66;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; }

.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,12,24,0.9); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 52px;
}
.logo { font-family: 'Black Han Sans', sans-serif; font-size: 17px; color: var(--accent2); text-decoration: none; }
.header-nav { display: flex; gap: 4px; }
.nav-a { font-size: 12px; color: var(--text3); padding: 5px 12px; border-radius: 7px; text-decoration: none; border: 1px solid transparent; transition: all .15s; }
.nav-a:hover { color: var(--text2); background: var(--bg3); }
.nav-a.active { color: var(--accent2); background: rgba(124,106,255,0.1); border-color: rgba(124,106,255,0.2); }

.main { max-width: 1000px; margin: 0 auto; padding: 28px 20px 80px; }

/* 탭 */
.tabs {
  display: flex; gap: 4px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 4px; margin-bottom: 24px;
  width: fit-content; flex-wrap: wrap;
}
.tab {
  padding: 8px 18px; border-radius: 9px; border: none;
  font-size: 13px; font-weight: 500; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.15s; color: var(--text3); background: transparent;
  display: flex; align-items: center; gap: 6px;
}
.tab.active { color: #fff; }
.tab:not(.active):hover { color: var(--text2); background: var(--bg3); }

.tab-gacha.active  { background: #b45309; }
.tab-raid.active   { background: #b91c1c; }
.tab-latea.active  { background: var(--accent); }
.tab-shop.active   { background: #065f46; }
.tab-breed.active  { background: #374151; }

/* 툴바 */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.search-input {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 14px; font-size: 13px;
  color: var(--text); font-family: 'Noto Sans KR', sans-serif;
  outline: none; transition: border-color .15s; width: 200px;
}
.search-input::placeholder { color: var(--text3); }
.search-input:focus { border-color: var(--accent); }
.sort-grp { display: flex; gap: 4px; margin-left: auto; }
.sort-btn {
  font-size: 11px; padding: 5px 12px; border-radius: 99px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text3); cursor: pointer; font-family: 'Noto Sans KR', sans-serif; transition: all .12s;
}
.sort-btn:hover { border-color: var(--border2); color: var(--text2); }
.sort-btn.on { border-color: var(--accent); color: var(--accent2); background: rgba(124,106,255,.1); }
.result-count { font-size: 12px; color: var(--text3); }

/* 섹션 헤더 */
.section-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px; padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.section-icon { font-size: 20px; }
.section-title { font-family: 'Black Han Sans', sans-serif; font-size: 18px; color: var(--text); letter-spacing: -.5px; }
.section-badge {
  font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 99px;
}
.section-desc { font-size: 12px; color: var(--text3); margin-top: 2px; }
.section-count { font-size: 12px; color: var(--text3); margin-left: auto; }

/* 드래곤 그리드 */
.dragon-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 8px; margin-bottom: 40px;
}
.dragon-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 8px 10px;
  display: flex; flex-direction: column; align-items: center;
  gap: 5px; text-align: center; transition: border-color .15s, transform .15s;
}
.dragon-card:hover { border-color: var(--border2); transform: translateY(-2px); }
.dc-img {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--bg3); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.dc-img img { width: 46px; height: 46px; object-fit: contain; image-rendering: pixelated; }
.dc-kor { font-size: 11px; font-weight: 700; color: var(--text); line-height: 1.3; }
.dc-eng { font-size: 9px; color: var(--text3); }

/* 등급 배지 색상 */
.badge-gacha { background: rgba(245,197,66,.15); color: var(--gold); border: 1px solid rgba(245,197,66,.3); }
.badge-raid  { background: rgba(255,107,107,.15); color: #ff6b6b; border: 1px solid rgba(255,107,107,.3); }
.badge-latea { background: rgba(124,106,255,.15); color: var(--accent2); border: 1px solid rgba(124,106,255,.3); }
.badge-shop  { background: rgba(52,211,153,.12); color: #6ee7b7; border: 1px solid rgba(52,211,153,.25); }
.badge-breed { background: rgba(255,255,255,.06); color: var(--text3); border: 1px solid var(--border); }

.no-result { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 14px; }

@media (max-width: 560px) {
  .header-nav { display: none; }
  .dragon-grid { grid-template-columns: repeat(auto-fill, minmax(85px,1fr)); }
  .search-input { width: 100%; }
}
</style>

const TAB_INFO = {
  gacha:  { key:'뽑기',       icon:'🎰', label:'뽑기',       desc:'가챠를 통해 획득할 수 있는 드래곤',       badge:'badge-gacha' },
  raid:   { key:'레이드',     icon:'⚔️', label:'레이드',     desc:'레이드 보상으로 획득할 수 있는 드래곤',   badge:'badge-raid'  },
  latea:  { key:'라테아의 문',icon:'🚪', label:'라테아의 문',desc:'라테아의 문을 통해 획득할 수 있는 드래곤', badge:'badge-latea' },
  shop:   { key:'빌리지 상점',icon:'🏪', label:'빌리지 상점',desc:'빌리지 상점에서 구매할 수 있는 드래곤',   badge:'badge-shop'  },
  breed:  { key:'교배',       icon:'🧬', label:'교배',       desc:'교배를 통해 획득할 수 있는 드래곤',       badge:'badge-breed' },
};

const GRADE_ORDER = { legendary:4, heroic:3, rare:2, common:1 };

let currentTab = 'gacha';
let sortMode = 'grade';

function switchTab(tab) {
  currentTab = tab;
  Object.keys(TAB_INFO).forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
  });
  render();
}

function setSort(s) {
  sortMode = s;
  document.getElementById('sort-grade').classList.toggle('on', s==='grade');
  document.getElementById('sort-name').classList.toggle('on', s==='name');
  render();
}

function render() {
  const q = document.getElementById('search').value.toLowerCase().replace(/ /g,'');
  const info = TAB_INFO[currentTab];
  const countEl = document.getElementById('result-count');
  const content = document.getElementById('content');

  let list = DRAGONS.filter(d => {
    const tabMatch = d.obtain === info.key;
    const searchMatch = !q || d.kor.replace(/ /g,'').toLowerCase().includes(q) || d.eng.toLowerCase().includes(q);
    return tabMatch && searchMatch;
  });

  if (sortMode === 'grade') {
    list.sort((a,b) => (GRADE_ORDER[b.grade]||0) - (GRADE_ORDER[a.grade]||0) || a.kor.localeCompare(b.kor));
  } else {
    list.sort((a,b) => a.kor.localeCompare(b.kor));
  }

  countEl.textContent = list.length + '마리';

  if (!list.length) {
    content.innerHTML = '<div class="no-result">해당하는 드래곤이 없습니다</div>';
    return;
  }

  // 등급별 그룹핑 (등급순일 때만)
  if (sortMode === 'grade') {
    const groups = {};
    const gradeLabel = { legendary:'전설', heroic:'영웅', rare:'희귀', common:'일반' };
    list.forEach(d => {
      if (!groups[d.grade]) groups[d.grade] = [];
      groups[d.grade].push(d);
    });

    const order = ['legendary','heroic','rare','common'];
    content.innerHTML = order.filter(g => groups[g]).map(g => `
      <div>
        <div class="section-head">
          <span class="section-title">${gradeLabel[g]}</span>
          <span class="section-count">${groups[g].length}마리</span>
        </div>
        <div class="dragon-grid">${groups[g].map(d => dragonCard(d)).join('')}</div>
      </div>
    `).join('');
  } else {
    content.innerHTML = `<div class="dragon-grid">${list.map(d => dragonCard(d)).join('')}</div>`;
  }
}

function dragonCard(d) {
  const noteTag = d.note ? `<span style="font-size:9px;color:var(--text3)">${d.note}</span>` : '';
  return `<div class="dragon-card">
    <div class="dc-img"><img src="${BASE}${d.id}.png" alt="${d.kor}" onerror="this.style.opacity=.2"></div>
    <div class="dc-kor">${d.kor}</div>
    <div class="dc-eng">${d.eng}</div>
    ${noteTag}
  </div>`;
}

render();
</script>

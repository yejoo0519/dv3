<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>드래곤 정보 - Dragon Village 3</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #121316; --bg2: #17181c; --bg3: #1d1f24; --bg4: #26282e;
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
  --accent: #7c6aff; --accent2: #a693ff;
  --gold: #f5c542; --hero: #9b7aff;
  --text: #ededee; --text2: #9a9ba1; --text3: #5d5e65;
  --legendary: #f5c542; --legendary-bg: rgba(245,197,66,0.12); --legendary-border: rgba(245,197,66,0.25);
  --heroic: #b47fff; --heroic-bg: rgba(180,127,255,0.12); --heroic-border: rgba(180,127,255,0.25);
  --rare: #38bdf8; --rare-bg: rgba(56,189,248,0.10); --rare-border: rgba(56,189,248,0.22);
  --physical: #ff6b6b; --physical-bg: rgba(255,107,107,0.12);
  --special: #60a5fa; --special-bg: rgba(96,165,250,0.12);
  --balance: #94a3b8; --balance-bg: rgba(148,163,184,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; }

/* 헤더 */
.header {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 52px;
}
.logo { font-family: 'Black Han Sans', sans-serif; font-size: 17px; color: var(--accent2); text-decoration: none; }
.sep { color: var(--text3); font-size: 13px; }
.page-name { font-size: 13px; color: var(--text2); }
.header-nav { display: flex; gap: 4px; }
.nav-a { font-size: 12px; color: var(--text3); padding: 5px 12px; border-radius: 7px; text-decoration: none; border: 1px solid transparent; transition: all .15s; }
.nav-a:hover { color: var(--text2); background: var(--bg3); }
.nav-a.active { color: var(--accent2); background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }

/* 메인 레이아웃 */
.main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 80px; }

/* 필터 바 */
.filter-bar {
  display: flex; align-items: center; gap: 10px; margin-bottom: 24px; flex-wrap: wrap;
}
.filter-label { font-size: 12px; color: var(--text3); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.filter-group { display: flex; gap: 5px; flex-wrap: wrap; }
.filter-btn {
  font-size: 12px; padding: 5px 14px; border-radius: 99px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text3); cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
  transition: all .15s;
}
.filter-btn:hover { border-color: var(--border2); color: var(--text2); }
.filter-btn.on { color: var(--text); }
.filter-btn.all.on { border-color: var(--accent); background: rgba(255,255,255,.12); color: var(--accent2); }
.filter-btn.legendary.on { border-color: var(--legendary-border); background: var(--legendary-bg); color: var(--legendary); }
.filter-btn.heroic.on { border-color: var(--heroic-border); background: var(--heroic-bg); color: var(--heroic); }
.filter-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
.filter-btn.physical.on { border-color: rgba(255,107,107,.3); background: var(--physical-bg); color: var(--physical); }
.filter-btn.special.on { border-color: rgba(96,165,250,.3); background: var(--special-bg); color: var(--special); }
/* 속성 필터 */
.attr-fire.on      { border-color:#ff7a5c66; background:#ff7a5c1f; color:#ff8e74; }
.attr-water.on     { border-color:#4fb0e866; background:#4fb0e81f; color:#6fc0f0; }
.attr-wind.on      { border-color:#5fd0a066; background:#5fd0a01f; color:#7fdcb4; }
.attr-steel.on     { border-color:#9aa6b866; background:#9aa6b81f; color:#aeb8c8; }
.attr-earth.on     { border-color:#c89b5a66; background:#c89b5a1f; color:#d4ab70; }
.attr-lightning.on { border-color:#f5c84a66; background:#f5c84a1f; color:#f7d264; }
.attr-light.on     { border-color:#f0e08a66; background:#f0e08a1f; color:#f3e7a4; }
.attr-dark.on      { border-color:#9b7ad666; background:#9b7ad61f; color:#b095e0; }
.attr-dream.on     { border-color:#e88fd066; background:#e88fd01f; color:#eea6da; }
.attr-soul.on      { border-color:#6ad0d866; background:#6ad0d81f; color:#88dce2; }
.attr-divine.on    { border-color:#b6e36a66; background:#b6e36a1f; color:#c6e98a; }
.attr-chaos.on     { border-color:#8b6ad666; background:#8b6ad61f; color:#a589e0; }
.attr-dawn.on      { border-color:#c3cee066; background:#c3cee01f; color:#d3dce8; }
.attr-dusk.on      { border-color:#e890aa66; background:#e890aa1f; color:#eea7bd; }
.filter-btn.balance.on { border-color: rgba(176,177,183,.3); background: var(--balance-bg); color: var(--balance); }

/* 검색 */
.search-wrap { margin-left: auto; }
.search-input {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 9px; padding: 7px 14px; font-size: 13px;
  color: var(--text); font-family: 'Noto Sans KR', sans-serif; outline: none;
  width: 180px; transition: border-color .15s;
}
.search-input::placeholder { color: var(--text3); }
.search-input:focus { border-color: var(--accent); }

/* 드래곤 그리드 */
.dragon-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 10px;
  margin-bottom: 32px;
}
.dragon-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 14px; padding: 12px 8px 10px;
  cursor: pointer; display: flex; flex-direction: column;
  align-items: center; gap: 6px; text-align: center;
  transition: all .15s; position: relative; overflow: hidden;
}
.dragon-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
}
.dragon-card.legendary::before { background: linear-gradient(90deg, var(--legendary), #ffffff); }
.dragon-card.heroic::before { background: linear-gradient(90deg, #bcbdc2, var(--heroic)); }
.dragon-card.rare::before { background: linear-gradient(90deg, #8d8e94, var(--rare)); }
.dragon-card:hover { border-color: var(--border2); transform: translateY(-2px); }
.dragon-card.selected { border-color: var(--accent); background: rgba(255,255,255,.06); }

.dc-img {
  width: 60px; height: 60px; border-radius: 50%;
  background: var(--bg3); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.dc-img img { width: 50px; height: 50px; object-fit: contain; image-rendering: pixelated; }
.dc-name { font-size: 11px; font-weight: 700; color: var(--text); line-height: 1.3; margin-bottom: 3px; }
.dc-badges { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; margin-bottom: 4px; }
.dc-attrs { display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; }
.dc-attrs img { width: 18px; height: 18px; object-fit: contain; }
.badge {
  font-size: 8px; font-weight: 700; padding: 1px 5px;
  border-radius: 4px; letter-spacing: .03em;
}
.badge-legendary { background: var(--legendary-bg); color: var(--legendary); border: 1px solid var(--legendary-border); }
.badge-heroic { background: var(--heroic-bg); color: var(--heroic); border: 1px solid var(--heroic-border); }
.badge-physical { background: var(--physical-bg); color: var(--physical); }
.badge-special { background: var(--special-bg); color: var(--special); }
.badge-balance { background: var(--balance-bg); color: var(--balance); }
.badge-rare { background: var(--rare-bg); color: var(--rare); border: 1px solid var(--rare-border); }


/* 속성 뱃지 */
.badge-attr { font-size: 8px; font-weight: 700; padding: 1px 5px; border-radius: 4px; }
.badge-attr-불      { background:rgba(184,185,190,.15); color:#c2c3c8; border:1px solid rgba(184,185,190,.3); }
.badge-attr-물      { background:rgba(150,151,158,.15);  color:#9a9ba1; border:1px solid rgba(150,151,158,.3); }
.badge-attr-바람    { background:rgba(184,185,190,.15);  color:#c2c3c8; border:1px solid rgba(184,185,190,.3); }
.badge-attr-강철    { background:rgba(176,177,183,.15); color:#b0b1b7; border:1px solid rgba(176,177,183,.3); }
.badge-attr-땅      { background:rgba(184,185,190,.15);  color:#c2c3c8; border:1px solid rgba(184,185,190,.3); }
.badge-attr-번개    { background:rgba(184,185,190,.15);  color:#c2c3c8; border:1px solid rgba(184,185,190,.3); }
.badge-attr-빛      { background:rgba(184,185,190,.15);  color:#c2c3c8; border:1px solid rgba(184,185,190,.3); }
.badge-attr-어둠    { background:rgba(184,185,190,.15); color:#c2c3c8; border:1px solid rgba(184,185,190,.3); }
.badge-attr-꿈      { background:rgba(184,185,190,.15); color:#c2c3c8; border:1px solid rgba(184,185,190,.3); }
.badge-attr-영혼    { background:rgba(184,185,190,.15);  color:#c2c3c8; border:1px solid rgba(184,185,190,.3); }
.badge-attr-신성    { background:rgba(184,185,190,.15);  color:#c2c3c8; border:1px solid rgba(184,185,190,.3); }
.badge-attr-혼돈    { background:rgba(184,185,190,.15);  color:#c2c3c8; border:1px solid rgba(184,185,190,.3); }
.badge-attr-여명    { background:rgba(184,185,190,.15); color:#c2c3c8; border:1px solid rgba(184,185,190,.3); }
.badge-attr-황혼    { background:rgba(184,185,190,.15); color:#c2c3c8; border:1px solid rgba(184,185,190,.3); }

.no-data { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 14px; }

/* ── 상세 패널 ── */
.detail-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.6); backdrop-filter: blur(6px);
  align-items: center; justify-content: center; padding: 20px;
}
.detail-overlay.open { display: flex; }

.detail-panel {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 24px; width: 100%; max-width: 640px;
  max-height: 88vh; overflow-y: auto;
  position: relative;
}
.detail-panel::-webkit-scrollbar { width: 3px; }
.detail-panel::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* 상단 네비 */
.detail-nav {
  position: sticky; top: 0; z-index: 10;
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  border-radius: 24px 24px 0 0;
}
.nav-arrows { display: flex; gap: 6px; }
.nav-arrow {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1px solid var(--border2); background: var(--bg3);
  color: var(--text2); cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.nav-arrow:hover { border-color: var(--accent); color: var(--accent2); background: rgba(255,255,255,.1); }
.nav-arrow:disabled { opacity: .3; cursor: not-allowed; }
.nav-counter { font-size: 12px; color: var(--text3); }
.detail-close {
  width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--border); background: transparent;
  color: var(--text2); cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.detail-close:hover { border-color: var(--border2); color: var(--text); }

/* 상세 콘텐츠 */
.detail-hero {
  padding: 28px 28px 20px;
  display: flex; gap: 24px; align-items: flex-start;
}
.detail-img-wrap {
  width: 110px; height: 110px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  border: 2px solid var(--border2); background: var(--bg3);
}
.detail-img-wrap img { width: 90px; height: 90px; object-fit: contain; image-rendering: pixelated; }
.detail-info { flex: 1; }
.detail-badges { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.detail-badge {
  font-size: 10px; font-weight: 700; padding: 3px 9px;
  border-radius: 99px; letter-spacing: .04em;
}
.detail-name { font-family: 'Black Han Sans', sans-serif; font-size: 26px; color: var(--text); letter-spacing: -0.5px; margin-bottom: 2px; }
.detail-eng { font-size: 12px; color: var(--text3); }

/* 스탯 */
.detail-section { padding: 0 28px 24px; }
.section-title {
  font-size: 11px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--text3);
  margin-bottom: 14px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.stat-list { display: flex; flex-direction: column; gap: 8px; }
.stat-row { display: flex; align-items: center; gap: 10px; }
.stat-label { font-size: 12px; color: var(--text2); width: 36px; flex-shrink: 0; }
.stat-bar-wrap { flex: 1; height: 6px; background: var(--bg3); border-radius: 99px; overflow: hidden; }
.stat-bar { height: 100%; border-radius: 99px; transition: width .6s cubic-bezier(.4,0,.2,1); }
.stat-val { font-size: 12px; font-weight: 700; color: var(--text); width: 40px; text-align: right; flex-shrink: 0; }
.stat-total {
  margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.stat-total-label { font-size: 12px; color: var(--text3); }
.stat-total-val { font-size: 15px; font-weight: 700; color: var(--text); }

/* 스킬/어빌리티 */
.skill-list { display: flex; flex-direction: column; gap: 10px; }
.skill-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 16px;
}
.skill-type {
  font-size: 9px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; margin-bottom: 5px;
}
.skill-name { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.skill-desc { font-size: 12px; color: var(--text2); line-height: 1.6; }
.skill-empty { font-size: 13px; color: var(--text3); text-align: center; padding: 20px; }

/* 스와이프 힌트 */
.swipe-hint {
  text-align: center; padding: 12px;
  font-size: 11px; color: var(--text3);
  border-top: 1px solid var(--border);
}


/* 스탯 툴팁 */
.stat-tooltip {
  position: fixed; z-index: 9999;
  background: var(--bg4); border: 1px solid var(--border2);
  border-radius: 9px; padding: 8px 12px;
  font-size: 12px; color: var(--text2); line-height: 1.6;
  max-width: 240px; pointer-events: none;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
  display: none;
}

/* ── 무채색 리파인 ── */
.filter-label { white-space: nowrap; }
.badge, .detail-badge, .badge-attr { white-space: nowrap; }
.dc-name { word-break: keep-all; }
.tdot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; vertical-align:middle; background:#8b8c92; }
.tdot.l { background:#f5c542; }
.tdot.m { background:#b47fff; }
.tdot.r { background:#38bdf8; }
.tdot.ring { background:transparent; box-shadow: inset 0 0 0 1.5px #abacb2; }

@media (max-width: 560px) {
  .dragon-grid { grid-template-columns: repeat(auto-fill, minmax(85px,1fr)); gap: 8px; }
  .detail-hero { flex-direction: column; align-items: center; text-align: center; padding: 20px 20px 16px; }
  .detail-section { padding: 0 20px 20px; }
  .header-nav { display: none; }
  .search-wrap { margin-left: 0; width: 100%; }
  .search-input { width: 100%; }
  .filter-bar { gap: 6px; }
}

/* ── 무채색: 한글 줄바꿈 + 플레이스홀더 무채색화 ── */
body { word-break: keep-all; }
.empty-ico, .no-img, .no-img-lg, .obtain-icon, .report-btn.kakao { filter: grayscale(1); }
</style>
</head>
<body>

<header class="header">
  <div style="display:flex;align-items:center;gap:10px">
    <a href="index.html" class="logo">DV3</a>
    <span class="sep">/</span>
    <span class="page-name">드래곤 정보</span>
  </div>
  <nav class="header-nav">
    <a href="index.html" class="nav-a">홈</a>
    <a href="breeding.html" class="nav-a">교배</a>
    <a href="gem.html" class="nav-a">보주</a>
    <a href="ability.html" class="nav-a">어빌리티</a>
    <a href="dragon.html" class="nav-a active">드래곤</a>
    <a href="obtain.html" class="nav-a">획득처</a>
  </nav>
</header>

<div class="main">

  <div class="filter-bar">
    <span class="filter-label">등급</span>
    <div class="filter-group">
      <button class="filter-btn all on" onclick="setFilter('grade','all')">전체</button>
      <button class="filter-btn legendary" onclick="setFilter('grade','legendary')"><span class="tdot l"></span>전설</button>
      <button class="filter-btn heroic" onclick="setFilter('grade','heroic')"><span class="tdot m"></span>영웅</button>
      <button class="filter-btn rare" onclick="setFilter('grade','rare')"><span class="tdot r"></span>희귀</button>
    </div>
    <div class="filter-sep"></div>
    <span class="filter-label">타입</span>
    <div class="filter-group">
      <button class="filter-btn all on" id="type-all" onclick="setFilter('type','all')">전체</button>
      <button class="filter-btn physical" onclick="setFilter('type','physical')"><span class="tdot"></span>물리</button>
      <button class="filter-btn special" onclick="setFilter('type','special')"><span class="tdot ring"></span>특수</button>
    <div style="width:100%;height:1px;background:var(--border);margin:4px 0"></div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">
      <span style="font-size:11px;color:var(--text3);font-weight:700;letter-spacing:.06em">속성</span>
      <button class="filter-btn all on" id="attr-all" onclick="setFilter('attr','all')">전체</button>
      <button class="filter-btn attr-fire"      onclick="setFilter('attr','불')"><img src="https://raw.githubusercontent.com/yejoo0519/dv3/refs/heads/main/images/element/element_fire_80.png" style="width:16px;height:16px;vertical-align:middle;margin-right:3px"> 불</button>
      <button class="filter-btn attr-water"     onclick="setFilter('attr','물')"><img src="https://raw.githubusercontent.com/yejoo0519/dv3/refs/heads/main/images/element/element_water_80.png" style="width:16px;height:16px;vertical-align:middle;margin-right:3px"> 물</button>
      <button class="filter-btn attr-wind"      onclick="setFilter('attr','바람')"><img src="https://raw.githubusercontent.com/yejoo0519/dv3/refs/heads/main/images/element/element_wind_80.png" style="width:16px;height:16px;vertical-align:middle;margin-right:3px"> 바람</button>
      <button class="filter-btn attr-steel"     onclick="setFilter('attr','강철')"><img src="https://raw.githubusercontent.com/yejoo0519/dv3/refs/heads/main/images/element/element_steel_80.png" style="width:16px;height:16px;vertical-align:middle;margin-right:3px"> 강철</button>
      <button class="filter-btn attr-earth"     onclick="setFilter('attr','땅')"><img src="https://raw.githubusercontent.com/yejoo0519/dv3/refs/heads/main/images/element/element_earth_80.png" style="width:16px;height:16px;vertical-align:middle;margin-right:3px"> 땅</button>
      <button class="filter-btn attr-lightning" onclick="setFilter('attr','번개')"><img src="https://raw.githubusercontent.com/yejoo0519/dv3/refs/heads/main/images/element/element_lightning_80.png" style="width:16px;height:16px;vertical-align:middle;margin-right:3px"> 번개</button>
      <button class="filter-btn attr-light"     onclick="setFilter('attr','빛')"><img src="https://raw.githubusercontent.com/yejoo0519/dv3/refs/heads/main/images/element/element_light_80.png" style="width:16px;height:16px;vertical-align:middle;margin-right:3px"> 빛</button>
      <button class="filter-btn attr-dark"      onclick="setFilter('attr','어둠')"><img src="https://raw.githubusercontent.com/yejoo0519/dv3/refs/heads/main/images/element/element_dark_80.png" style="width:16px;height:16px;vertical-align:middle;margin-right:3px"> 어둠</button>

const GRADE_LABEL = { legendary:'전설', heroic:'영웅', rare:'희귀', common:'일반' };
const TYPE_LABEL  = { physical:'물리형', special:'특수형' };
const STAT_COLORS = {
  physical: '#ff6b6b', special: '#60a5fa'
};
const STAT_KEYS = ['hp','atk','def','spatk','spdef','spd'];
const STAT_LABELS = { hp:'체력', atk:'공격', def:'방어', spatk:'마력', spdef:'저항', spd:'속도' };
const STAT_DESC = {
  hp:    '드래곤의 생명 수치입니다. 0이 되면 전투 불능 상태가 되며, 높을수록 전장에서 더 오래 버틸 수 있습니다.',
  atk:   '공격이 높을수록 물리 스킬의 피해량이 증가합니다.',
  def:   '방어가 높을수록 적이 사용하는 물리 스킬로부터 입는 피해량이 감소합니다.',
  spatk: '마력이 높을수록 마법 스킬의 피해량이 증가합니다.',
  spdef: '저항이 높을수록 적이 사용하는 마법 스킬로부터 입는 피해량이 감소합니다.',
  spd:   '전투 행동의 우선 순위에 관여하는 수치입니다. 전투에서는 상대보다 속도가 더 빠른 드래곤이 우선적으로 전투 행동을 수행합니다.',
};

let gradeFilter = 'all';
let typeFilter  = 'all';
let attrF       = 'all';
let currentIdx  = -1;
let filteredList = [];

function setFilter(kind, val) {
  if (kind === 'grade') {
    gradeFilter = val;
    document.querySelectorAll('.filter-btn.all, .filter-btn.legendary, .filter-btn.heroic, .filter-btn.rare')
      .forEach(b => b.classList.remove('on'));
    document.querySelector(val === 'all' ? '.filter-btn.all' : `.filter-btn.${val}`).classList.add('on');
  } else if (kind === 'type') {
    typeFilter = val;
    document.querySelectorAll('#type-all, .filter-btn.physical, .filter-btn.special')
      .forEach(b => b.classList.remove('on'));
    const map = { all:'#type-all', physical:'.filter-btn.physical', special:'.filter-btn.special' };
    document.querySelector(map[val])?.classList.add('on');
  } else if (kind === 'attr') {
    attrF = val;
    document.querySelectorAll('#attr-all, [class*="attr-fire"],[class*="attr-water"],[class*="attr-wind"],[class*="attr-steel"],[class*="attr-earth"],[class*="attr-lightning"],[class*="attr-light"],[class*="attr-dark"],[class*="attr-dream"],[class*="attr-soul"],[class*="attr-divine"],[class*="attr-chaos"],[class*="attr-dawn"],[class*="attr-dusk"]')
      .forEach(b => b.classList.remove('on'));
    if (val === 'all') document.getElementById('attr-all')?.classList.add('on');
    else event.currentTarget.classList.add('on');
  }
  renderGrid();
}

// 스탯 툴팁
function showTip(e, text) {
  const tip = document.getElementById('stat-tooltip');
  tip.textContent = text;
  tip.style.display = 'block';
  const x = e.clientX + 12, y = e.clientY - 10;
  tip.style.left = Math.min(x, window.innerWidth - 260) + 'px';
  tip.style.top = Math.max(y, 8) + 'px';
}
function hideTip() {
  document.getElementById('stat-tooltip').style.display = 'none';
}

renderGrid();

function getFiltered() {
  const q = document.getElementById('search-input').value.toLowerCase().replace(/ /g,'');
  return DRAGONS.filter(d => {
    const gradeOk = gradeFilter === 'all' || d.grade === gradeFilter;
    const typeOk  = typeFilter  === 'all' || d.type  === typeFilter;
    const attrOk  = attrF       === 'all' || (d.attrs && d.attrs.includes(attrF));
    const searchOk = !q || d.kor.replace(/ /g,'').toLowerCase().includes(q) || d.id.includes(q);
    return gradeOk && typeOk && attrOk && searchOk;
  });
}

function renderGrid() {
  filteredList = getFiltered();
  const grid = document.getElementById('dragon-grid');
  if (!filteredList.length) {
    grid.innerHTML = '<div class="no-data">해당하는 드래곤이 없습니다</div>';
    return;
  }
  grid.innerHTML = filteredList.map((d, i) => {
    const attrIcons = d.attrs ? d.attrs.map(a => `<img src="${ATTR_ICON_BASE}${ATTR_ICON[a]||''}" alt="${a}" title="${a}">`).join('') : '';
    return `<div class="dragon-card ${d.grade}" onclick="openDetail(${i})" id="dc-${i}">
      <div class="dc-img">
        <img src="${BASE}${d.id}.png" alt="${d.kor}" onerror="this.style.opacity=.2">
      </div>
      <div class="dc-name">${d.kor}</div>
      <div class="dc-badges">
        <span class="badge badge-${d.grade}">${GRADE_LABEL[d.grade]}</span>
        ${d.type ? `<span class="badge badge-${d.type}">${TYPE_LABEL[d.type]}</span>` : ''}
      </div>
      <div class="dc-attrs">${attrIcons}</div>
    </div>`;
  }).join('');
}

function openDetail(idx) {
  currentIdx = idx;
  renderDetail();
  document.getElementById('detail-overlay').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('open');
}

function closeDetailOutside(e) {
  if (e.target === document.getElementById('detail-overlay')) closeDetail();
}

function navigate(dir) {
  const next = currentIdx + dir;
  if (next < 0 || next >= filteredList.length) return;
  currentIdx = next;
  renderDetail();
}

function renderDetail() {
  const d = filteredList[currentIdx];
  if (!d) return;

  // 네비
  document.getElementById('nav-counter').textContent = `${currentIdx + 1} / ${filteredList.length}`;
  document.getElementById('nav-prev').disabled = currentIdx === 0;
  document.getElementById('nav-next').disabled = currentIdx === filteredList.length - 1;

  // 헤더
  const eng = d.id.replace(/_00_adult|_01_adult/g,'');
  document.getElementById('d-img').src = `${BASE}${d.id}.png`;
  document.getElementById('d-img').alt = d.kor;
  document.getElementById('d-name').textContent = d.kor;
  document.getElementById('d-eng').textContent = eng;

  // 등급/타입 뱃지
  const gradeColors = {
    legendary: 'background:rgba(255,255,255,.15);color:#ececed;border:1px solid rgba(255,255,255,.3)',
    heroic:    'background:rgba(188,189,194,.15);color:#bcbdc2;border:1px solid rgba(188,189,194,.3)',
    rare:      'background:rgba(150,151,158,.12);color:#9a9ba1;border:1px solid rgba(150,151,158,.25)',
  };
  const typeColors = {
    physical: 'background:rgba(255,107,107,.12);color:#ff6b6b',
    special:  'background:rgba(96,165,250,.12);color:#60a5fa',

  };
  document.getElementById('d-badges').innerHTML =
    `<span class="detail-badge" style="${gradeColors[d.grade]||''}">${GRADE_LABEL[d.grade]}</span>` +
    (d.type ? `<span class="detail-badge" style="${typeColors[d.type]||''}">${TYPE_LABEL[d.type]}</span>` : '');

  document.getElementById('d-attrs').innerHTML = d.attrs
    ? d.attrs.map(a => `
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
          <img src="${ATTR_ICON_BASE}${ATTR_ICON[a]||''}" style="width:40px;height:40px">
          <span style="font-size:10px;color:var(--text2);font-weight:700">${a}</span>
        </div>`).join('')
    : '<span style="color:var(--text3);font-size:12px">정보 없음</span>';

  // 이미지 테두리 색
  const imgWrap = document.getElementById('d-img-wrap');
  imgWrap.style.borderColor = d.grade === 'legendary' ? 'rgba(255,255,255,.4)' : 'rgba(188,189,194,.4)';

  // 스탯
  const statsEl = document.getElementById('d-stats');
  if (d.stats) {
    const maxStat = 1700;
    const color = d.type ? STAT_COLORS[d.type] : '#c7c8cc';
    const total = Object.values(d.stats).reduce((a,b)=>a+b,0);
    statsEl.innerHTML = STAT_KEYS.map(k => `
      <div class="stat-row" style="position:relative" onmouseenter="showTip(event,'${STAT_DESC[k]}')" onmouseleave="hideTip()">
        <span class="stat-label">${STAT_LABELS[k]}</span>
        <div class="stat-bar-wrap">
          <div class="stat-bar" style="width:${(d.stats[k]/maxStat*100).toFixed(1)}%;background:${color}"></div>
        </div>
        <span class="stat-val">${d.stats[k]}</span>
      </div>`).join('') +
      `<div class="stat-total">
        <span class="stat-total-label">총합</span>
        <span class="stat-total-val">${total.toLocaleString()}</span>
      </div>`;
  } else {
    statsEl.innerHTML = '<div class="skill-empty">스탯 데이터 수집 중</div>';
  }

  // 스킬
  const skillsEl = document.getElementById('d-skills');
  if (d.skills && d.skills.length) {
    skillsEl.innerHTML = d.skills.map(s => `
      <div class="skill-card">
        <div class="skill-type" style="color:${s.type==='필살기'?'#f5c542':'#a693ff'}">${s.type}</div>
        <div class="skill-name">${s.name}</div>
        <div class="skill-desc">${s.desc}</div>
      </div>`).join('');
  } else {
    skillsEl.innerHTML = '<div class="skill-empty">스킬 데이터 수집 중</div>';
  }

  // 어빌리티
  const abilEl = document.getElementById('d-ability');
  if (d.ability && d.ability.length) {
    abilEl.innerHTML = d.ability.map(a => `
      <div class="skill-card">
        <div class="skill-name">${a.name}</div>
        <div class="skill-desc">${a.desc}</div>
      </div>`).join('');
  } else {
    abilEl.innerHTML = '<div class="skill-empty">어빌리티 데이터 수집 중</div>';
  }

  // 패널 스크롤 초기화
  document.getElementById('detail-panel').scrollTop = 0;
}

// 키보드 네비게이션
document.addEventListener('keydown', e => {
  if (!document.getElementById('detail-overlay').classList.contains('open')) return;
  if (e.key === 'ArrowLeft')  navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key === 'Escape')     closeDetail();
});

// 터치 스와이프
let touchStartX = 0;
document.getElementById('detail-panel').addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
});
document.getElementById('detail-panel').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) navigate(dx < 0 ? 1 : -1);
});


// 스탯 툴팁
function showTip(e, text) {
  const tip = document.getElementById('stat-tooltip');
  tip.textContent = text;
  tip.style.display = 'block';
  const x = e.clientX + 12, y = e.clientY - 10;
  tip.style.left = Math.min(x, window.innerWidth - 260) + 'px';
  tip.style.top = Math.max(y, 8) + 'px';
}
function hideTip() {
  document.getElementById('stat-tooltip').style.display = 'none';
}

renderGrid();
</script>
</body>
</html>
